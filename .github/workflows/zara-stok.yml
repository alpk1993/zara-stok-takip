name: Zara 50 ve 52 stok kontrolu
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zara-stok
  cancel-in-progress: false
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Kutuphaneleri ve tarayiciyi yukle
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Zara stok kontrolu
        env:
          ZARA_HEADED: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run -a python zara_takip.py --once
      - name: Teshis raporunu kaydet
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zara-stok-teshis
          path: stok_teshis.json
          retention-days: 3
          if-no-files-found: warn
      - name: Son durumu kaydet
        if: success()
        run: |
          if [ -f durum.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add durum.json
            if ! git diff --cached --quiet; then
              git commit -m "Update last confirmed size status [skip ci]"
              git push
            fi
          fi
